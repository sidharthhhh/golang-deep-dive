apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-config
data:
  mysql-host: "mysql-service"
  mysql-port: "3306"
  mysql-database: "auth_service"
  # TODO: Replace <NODE_IP> with your actual node IP (e.g. 192.168.1.54)
  cors-allowed-origins: "http://localhost:3000,http://localhost:8080,http://auth.<NODE_IP>.nip.io"
