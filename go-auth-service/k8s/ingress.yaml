apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth-service-ingress
spec:
  ingressClassName: traefik
  rules:
  # TODO: Replace <NODE_IP> with your actual node IP (e.g. 192.168.1.54)
  - host: auth.<NODE_IP>.nip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 80
